<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">FG Responsive Tables</title>
  <defs>
    <!-- Same FG navy as the rest of the series; userSpaceOnUse so the card "gap"
         strokes below can reuse it and match the background exactly everywhere. -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#081D32"/>
      <stop offset="100%" stop-color="#113758"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <g transform="translate(-2,0)">
    <!-- Desktop table: white frame, coloured cells (first column + header = labels) -->
    <rect x="51" y="151" width="209" height="209" rx="20" fill="#FFFFFF"/>
    <rect x="66" y="166" width="179" height="33" rx="6" fill="#3F78A8"/>
    <g fill="#3F78A8">
      <rect x="66"  y="210"   width="55" height="28.5" rx="6"/>
      <rect x="66"  y="245.5" width="55" height="28.5" rx="6"/>
      <rect x="66"  y="281"   width="55" height="28.5" rx="6"/>
      <rect x="66"  y="316.5" width="55" height="28.5" rx="6"/>
    </g>
    <g fill="#B2C3D3">
      <rect x="128" y="210"   width="55" height="28.5" rx="6"/><rect x="190" y="210"   width="55" height="28.5" rx="6"/>
      <rect x="128" y="245.5" width="55" height="28.5" rx="6"/><rect x="190" y="245.5" width="55" height="28.5" rx="6"/>
      <rect x="128" y="281"   width="55" height="28.5" rx="6"/><rect x="190" y="281"   width="55" height="28.5" rx="6"/>
      <rect x="128" y="316.5" width="55" height="28.5" rx="6"/><rect x="190" y="316.5" width="55" height="28.5" rx="6"/>
    </g>

    <!-- Arrow -->
    <polyline points="274,225 297,256 274,287" fill="none" stroke="#FF6B4A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Mobile cards: three identical cards stacked up and to the right.
         Each gets a navy "gap" stroke so white cards don't merge into each other. -->
    <g id="card-back">
      <rect x="359" y="146" width="107" height="155" rx="14" fill="url(#bg)" stroke="url(#bg)" stroke-width="12"/>
      <rect x="359" y="146" width="107" height="155" rx="14" fill="#FFFFFF"/>
      <rect x="371" y="161" width="83" height="32" rx="7" fill="#113758"/>
      <g fill="#B2C3D3"><rect x="371" y="202" width="83" height="24" rx="7"/><rect x="371" y="233" width="83" height="24" rx="7"/><rect x="371" y="264" width="83" height="24" rx="7"/></g>
    </g>
    <g id="card-middle">
      <rect x="335" y="178" width="107" height="155" rx="14" fill="url(#bg)" stroke="url(#bg)" stroke-width="12"/>
      <rect x="335" y="178" width="107" height="155" rx="14" fill="#FFFFFF"/>
      <rect x="347" y="193" width="83" height="32" rx="7" fill="#113758"/>
      <g fill="#B2C3D3"><rect x="347" y="234" width="83" height="24" rx="7"/><rect x="347" y="265" width="83" height="24" rx="7"/><rect x="347" y="296" width="83" height="24" rx="7"/></g>
    </g>
    <g id="card-front">
      <rect x="311" y="210" width="107" height="155" rx="14" fill="url(#bg)" stroke="url(#bg)" stroke-width="12"/>
      <rect x="311" y="210" width="107" height="155" rx="14" fill="#FFFFFF"/>
      <rect x="323" y="225" width="83" height="32" rx="7" fill="#113758"/>
      <g fill="#B2C3D3"><rect x="323" y="266" width="83" height="24" rx="7"/><rect x="323" y="297" width="83" height="24" rx="7"/><rect x="323" y="328" width="83" height="24" rx="7"/></g>
    </g>
  </g>
</svg>
